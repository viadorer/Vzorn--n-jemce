<!-- Shared contact popup (loaded via js/load-popup.js) -->
<style>
    dialog#contact-dialog {
        padding: 0;
        border: 0;
        background: transparent;
        max-width: 36rem;
        width: calc(100% - 2rem);
        /* Native <dialog> centering — explicit, ať to nepřebije Tailwindův m-0 */
        margin: auto;
        position: fixed;
        inset: 0;
        max-height: calc(100dvh - 2rem);
    }
    dialog#contact-dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    dialog#contact-dialog[open] {
        animation: contact-popup-in 0.25s ease-out;
    }
    @keyframes contact-popup-in {
        from { opacity: 0; transform: translate(0, 16px) scale(0.96); }
        to   { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    /* Scoped styling for embedded contact forms */
    .contact-embed input,
    .contact-embed textarea,
    .contact-embed select {
        width: 100% !important;
        padding: 12px 14px !important;
        border: 1px solid #e5e7eb !important;
        border-radius: 12px !important;
        background-color: #f9fafb !important;
        color: #111827 !important;
        font-size: 14px !important;
        line-height: 1.5 !important;
        box-shadow: none !important;
        outline: none !important;
        transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease !important;
    }
    .contact-embed input::placeholder,
    .contact-embed textarea::placeholder { color: #9ca3af !important; }
    .contact-embed textarea {
        min-height: 160px !important;
        resize: vertical !important;
        overflow: auto !important;
        display: block !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
    }
    .contact-embed input:focus,
    .contact-embed textarea:focus,
    .contact-embed select:focus {
        border-color: #E63946 !important;
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(13, 40, 242, 0.12) !important;
    }
    .contact-embed label {
        color: #374151 !important;
        font-weight: 600 !important;
        margin-bottom: 6px !important;
        display: block !important;
    }
    .contact-embed button,
    .contact-embed [type="submit"],
    .contact-embed .btn,
    .contact-embed .button {
        background-color: #E63946 !important;
        color: #ffffff !important;
        border-radius: 9999px !important;
        padding: 12px 18px !important;
        font-weight: 700 !important;
        border: none !important;
        box-shadow: 0 10px 15px -3px rgba(13, 40, 242, 0.25), 0 4px 6px -4px rgba(13, 40, 242, 0.25) !important;
        transition: transform .15s ease, background-color .2s ease !important;
    }
    .contact-embed button:hover,
    .contact-embed [type="submit"]:hover,
    .contact-embed .btn:hover,
    .contact-embed .button:hover {
        background-color: rgba(13, 40, 242, 0.9) !important;
        transform: translateY(-1px) !important;
    }
    .contact-embed input,
    .contact-embed textarea,
    .contact-embed select { margin-bottom: 10px !important; }
    .contact-embed .form-group { margin-bottom: 12px !important; }
    .contact-embed small,
    .contact-embed .hint,
    .contact-embed .consent { color: #6b7280 !important; font-size: 12px !important; }
</style>

<dialog id="contact-dialog" class="bg-transparent p-0 m-0 max-w-xl w-full backdrop:bg-black/50 backdrop:backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden relative mx-auto">
        <button type="button" data-popup-close class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 z-10 cursor-pointer" aria-label="Zavřít">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div class="text-center pt-10 pb-4 px-6">
            <img src="images/logo.png" alt="Vzorný nájemce" class="h-8 mx-auto mb-3">
            <h2 class="text-2xl font-bold text-gray-900">Kolik vám váš byt vydělá s námi?</h2>
            <p class="text-gray-600 mt-2">Napište nám pár vět o svém bytu. Do 24 hodin vám pošleme odhad nájmu, konkrétní nabídku a tipy, jak z bytu vytěžit víc.</p>
        </div>
        <div id="popup-widget-slot" class="w-full px-6 pb-8" style="min-height: 480px;">

                    w['ecm-widget']=o;w[o] = w[o] || function () { (w[o].q = w[o].q || []).push(arguments) };
                    js = d.createElement(s), fjs = d.getElementsByTagName(s)[0];
                    js.id = '24-68ad80a8296783256b609ecdeff8aa3e'; js.dataset.a = 'ptf'; js.src = f; js.async = 1; fjs.parentNode.insertBefore(js, fjs);
                }(window, document, 'script', 'ecmwidget', 'https://d70shl7vidtft.cloudfront.net/widget.js'));

            <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
                <div id="f-24-68ad80a8296783256b609ecdeff8aa3e" class="w-full h-full contact-embed"></div>
